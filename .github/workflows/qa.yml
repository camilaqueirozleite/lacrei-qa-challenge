name: Lacrei QA CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

jobs:
  e2e:
    name: Cypress, performance and Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CYPRESS_BASE_URL: https://paciente-staging.lacreisaude.com.br
      CYPRESS_REGISTER_PATH: /saude/paciente/cadastrar/
      CYPRESS_SEARCH_PATH: /saude/paciente/profissionais/buscar
      CYPRESS_FORGOT_PASSWORD_PATH: /saude/paciente/redefinir-senha/
      PERFORMANCE_URLS: https://paciente-staging.lacreisaude.com.br/login/,https://paciente-staging.lacreisaude.com.br/saude/paciente/cadastrar/,https://paciente-staging.lacreisaude.com.br/saude/paciente/profissionais/buscar
      PERF_VIRTUAL_USERS: 30
      PERF_P95_THRESHOLD_MS: 500

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run Cypress mobile validation suite
        run: npm run test:e2e:mobile:ci

      - name: Run performance smoke
        continue-on-error: true
        run: npm run test:perf

      - name: Run Lighthouse CI
        continue-on-error: true
        run: npm run lighthouse

      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lacrei-qa-reports
          path: |
            reports/
            cypress/downloads/
          if-no-files-found: warn
